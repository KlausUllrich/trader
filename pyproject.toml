[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trader"
version = "0.1.0"
description = "Consensus-based trade signal generator for ActivTrades CFDs (signals only, no execution)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "requests>=2.31",
  "yfinance>=0.2.40",
  "ccxt>=4.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
trader = "trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trader = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
