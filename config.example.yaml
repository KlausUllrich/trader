# Copy to config.yaml and adjust. All costs are ESTIMATES of ActivTrades
# conditions; check the real spreads and swaps in your demo account
# (MT5: right-click symbol -> Specification) and correct them here.

account:
  capital: 10000          # starting balance in USD
  max_drawdown: 5000      # hard stop: stop trading signals beyond this loss
  risk_per_trade: 0.01    # fraction of capital risked on a full-size signal
  max_open_positions: 4   # across all instruments
  daily_loss_limit: 0.03  # no new signals after losing this fraction in a day

timeframe: 1h

signal:
  # The strategies vote on DAILY bars; the scan still runs every hour and a signal is
  # sent on the first hourly bar after a daily close changes the consensus. On 1h bars
  # the same rules had no edge before costs (out-of-sample profit factor 0.84).
  # Remove this line to vote on the 1h bars again.
  timeframe: 1d
  # How many of the 3 strategies must agree, and the size for each level.
  # 3 agree -> full size; 2 agree and none opposes -> half size.
  min_agree: 2
  size_by_agreement: {3: 1.0, 2: 0.5}

exits:
  atr_period: 14       # ATR on the signal timeframe (daily ATR with timeframe: 1d)
  stop_atr: 2.0        # stop loss distance in ATR
  target_atr: 3.0      # take profit distance in ATR (0 = no fixed target)
  trail_atr: 0.0       # trailing stop in ATR (0 = off)
  max_days: 15         # time stop in days (overrides max_bars; markets have different bars per day)
  max_bars: 48         # time stop in bars, used when max_days is not set

strategies:
  trend:     {fast: 50, slow: 200}
  breakout:  {lookback: 20, recent: 5, roc_period: 24}
  pullback:  {rsi_period: 14, low: 40, high: 60, recent: 3}
  # Large traders' positioning as a 4th vote, for instruments with a `cot` contract.
  # Off: on 2010-2017 daily data it raised the profit factor only from 0.81 to 0.89.
  # cot:     {rule: follow, weeks: 4, min_change: 0.02}

backtest:
  out_of_sample: 0.3   # last 30% of each series is held out

# source: yahoo (yfinance), ccxt (crypto exchange), or csv (e.g. MT5 export)
# spread_bps: round-trip cost charged as a spread, in basis points of price
# commission: per-side commission as a fraction of notional (share CFDs)
# swap_annual: overnight financing as an annual fraction of notional
# leverage: ESMA retail cap at ActivTrades
# group: heading the market is listed under in the app (optional)
instruments:
  # Commodities
  # cot: CFTC Commitments of Traders contract for the large-trader vote (see cot.py)
  - {name: GOLD,    group: Commodities, source: yahoo, symbol: "GC=F", cot: {code: "088691"}, spread_bps: 1.5, swap_annual: 0.06, leverage: 20}
  - {name: SILVER,  group: Commodities, source: yahoo, symbol: "SI=F", cot: {code: "084691"}, spread_bps: 6,   swap_annual: 0.06, leverage: 10}
  - {name: BRENT,   group: Commodities, source: yahoo, symbol: "BZ=F", cot: {code: "067651"}, spread_bps: 8,   swap_annual: 0.06, leverage: 10}
  - {name: NATGAS,  group: Commodities, source: yahoo, symbol: "NG=F", cot: {code: "023651"}, spread_bps: 15,  swap_annual: 0.06, leverage: 10}
  # US tech
  - {name: USA100,  group: US tech, source: yahoo, symbol: "NQ=F", cot: {code: "209742", report: tff}, spread_bps: 1.5, swap_annual: 0.07, leverage: 20}
  - {name: NVDA,    group: US tech, source: yahoo, symbol: "NVDA", spread_bps: 3, commission: 0.0005, swap_annual: 0.07, leverage: 5}
  - {name: MSFT,    group: US tech, source: yahoo, symbol: "MSFT", spread_bps: 3, commission: 0.0005, swap_annual: 0.07, leverage: 5}
  - {name: AAPL,    group: US tech, source: yahoo, symbol: "AAPL", spread_bps: 3, commission: 0.0005, swap_annual: 0.07, leverage: 5}
  # Crypto
  - {name: BTCUSD,  group: Crypto, source: ccxt, exchange: binance, symbol: "BTC/USDT", whales: BTC, spread_bps: 10, swap_annual: 0.20, leverage: 2}
  - {name: ETHUSD,  group: Crypto, source: ccxt, exchange: binance, symbol: "ETH/USDT", whales: ETH, spread_bps: 15, swap_annual: 0.20, leverage: 2}
  - {name: SOLUSD,  group: Crypto, source: ccxt, exchange: binance, symbol: "SOL/USDT", whales: SOL, spread_bps: 30, swap_annual: 0.20, leverage: 2}
  # Exact broker prices: export history from the ActivTrades MT5 demo to CSV
  # - {name: GOLD_AT, source: csv, path: data/GOLD_H1.csv, spread_bps: 1.5, swap_annual: 0.06, leverage: 20}

# Top Hyperliquid traders' stance on BTC/ETH/SOL, recorded every scan to
# data/whales.csv and shown in crypto signals. Not a vote until it can be backtested.
whales:
  top: 50              # best wallets by last month's profit (and profitable all time)
  min_account: 100000  # USD
  threshold: 0.6       # share of wallets on one side to call it long or short

notify:
  # Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in the environment (or .env)
  telegram: true
  console: true
